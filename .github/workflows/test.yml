name: Test
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_version: [12, 13, 14, 15, 16, 17]
        build: [automake, meson]

    container:
      image: ghcr.io/postgres-dev/ubuntu-22.04:1.0
      options: --privileged
      env:
        PGDATA: /tmp/pgdata
        PG_BRANCH: ${{ format('REL_{0}_STABLE', matrix.pg_version) }}

    steps:
      # 1. Get Postgres sources
      - name: Checkout PostgreSQL
        uses: actions/checkout@v3
        with:
          repository: postgres/postgres
          ref: ${{ format('REL_{0}_STABLE', matrix.pg_version) }}
          path: postgres

      # 2. Get extension
      - name: Checkout shared_ispell
        uses: actions/checkout@v3
        with:
          path: shared_ispell

      # 3. Install Postgres
      - name: Install Postgres
        run: |
          cd $GITHUB_WORKSPACE/postgres
          ./configure --prefix=$HOME/pgsql --enable-debug --enable-cassert --enable-depend --enable-tap-tests
          make -sj $(nproc) install MAKELEVEL=0
          make -sj $(nproc) -C contrib/ install MAKELEVEL=0
          echo "$HOME/pgsql/bin" >> $GITHUB_PATH

      # 4. Set PG_CONFIG
      - name: Set PG_CONFIG
        run: |
          echo "PG_CONFIG=$HOME/pgsql/bin/pg_config" >> $GITHUB_ENV

      # 5. Build extension (automake) - MOVED UP
      - name: Build (automake)
        if: matrix.build == 'automake'
        run: |
          cd shared_ispell
          make USE_PGXS=1
          make USE_PGXS=1 install

      # 6. Build extension (meson) - MOVED UP
      - name: Build (meson)
        if: matrix.build == 'meson'
        run: |
          PREFIX=$($PG_CONFIG --pgxs | sed 's|/lib/pgxs/src/makefiles/pgxs.mk ||')
          meson setup builddir --prefix=$PREFIX
          meson compile -C builddir
          meson install -C builddir

      # 7. Prepare directories and fix permissions for the 'dev' user
      - name: Prepare directories for dev user
        run: |
          # Give 'dev' ownership of the extension folder so it can write test logs
          chown -R dev: shared_ispell
          # Create and assign ownership of the Postgres data directory
          mkdir -p $PGDATA
          chown dev: $PGDATA

      # 8. Init + start server (Now shared_ispell.so exists in the lib folder!)
      - name: Start PostgreSQL
        run: |
          runuser dev -c "initdb -D $PGDATA"
          runuser dev -c "pg_ctl -D $PGDATA -o '-F -k /tmp -c shared_preload_libraries=shared_ispell' -w start"

      # 9. Create extension + run tests (Executed as 'dev' user)
      - name: Check create extension
        run: |
          cd shared_ispell
          createdb test
          psql -d test -c "CREATE EXTENSION shared_ispell;"
        shell: runuser dev {0}

      - name: Run tests
        run: |
          cd shared_ispell
          if [ "${{ matrix.build }}" = "meson" ]; then
            meson test -C builddir --verbose
          else
            make USE_PGXS=1 installcheck
          fi
        shell: runuser dev {0}
